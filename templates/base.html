{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reliability Lab{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script defer src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="site-header">
    <a class="brand" href="{% url 'home' %}">Django/HTMX Reliability Lab</a>
    <span class="tagline">Small workflows. Explicit guarantees.</span>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

[project]
name = "mydjangocs-infrastructure"
version = "0.1.0.dev0"
description = "A small lab for reliable Django and HTMX workflow execution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ008"]

[tool.ruff.lint.per-file-ignores]
"workflows/migrations/*.py" = ["E501"]
